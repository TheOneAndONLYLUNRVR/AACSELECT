# One Render Web Service = website + API + live updates, all in one Node server.
services:
  - type: web
    name: aacselect
    runtime: node
    plan: starter            # paid plan: always on + allows a persistent disk
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /data/data.json
    disk:
      name: aac-data
      mountPath: /data
      sizeGB: 1
